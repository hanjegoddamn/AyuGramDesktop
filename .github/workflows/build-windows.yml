name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Windows x64 Debug
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: cmd

    steps:
      - name: Disable Windows Defender and Free Space
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -ExclusionPath "C:\", "D:\"

          Write-Host "Initial disk space:"
          Get-PSDrive C, D -ErrorAction SilentlyContinue

          # Free up space on C:
          Get-ChildItem -Path "C:\hostedtoolcache\windows" -Exclude "Python" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:TEMP\*" -ErrorAction SilentlyContinue

          Write-Host "Disk space after cleanup:"
          Get-PSDrive C, D -ErrorAction SilentlyContinue
        shell: powershell

      - name: Prepare directories on D drive
        run: |
          mkdir D:\TBuild\Libraries
          mkdir D:\TBuild\ThirdParty
          mkdir D:\TBuild\cache_keys
          mklink /d %userprofile%\TBuild D:\TBuild
          mklink /d %GITHUB_WORKSPACE%\TBuild D:\TBuild

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ github.workspace }}\TBuild\AyuGramDesktop

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.44

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Libraries Cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            C:/Users/runneradmin/TBuild/Libraries/win64
            C:/Users/runneradmin/TBuild/ThirdParty
            C:/Users/runneradmin/TBuild/cache_keys
          key: ${{ runner.os }}-x64-tdesktop-libs-${{ hashFiles('**/Telegram/build/prepare/**') }}
          restore-keys: |
            ${{ runner.os }}-x64-tdesktop-libs-

      - name: Setup cache keys
        run: |
          if exist D:\TBuild\cache_keys (
            mkdir D:\TBuild\Libraries\win64\cache_keys 2>nul
            mkdir D:\TBuild\ThirdParty\cache_keys 2>nul
            xcopy /E /I /Y D:\TBuild\cache_keys\* D:\TBuild\Libraries\win64\cache_keys\
            xcopy /E /I /Y D:\TBuild\cache_keys\* D:\TBuild\ThirdParty\cache_keys\
          )

      - name: Prepare Libraries
        run: |
          cd %GITHUB_WORKSPACE%\TBuild\AyuGramDesktop\Telegram
          build\prepare\win.bat skip-release silent qt6

      - name: Save Libraries Cache
        if: always() && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            C:/Users/runneradmin/TBuild/Libraries/win64
            C:/Users/runneradmin/TBuild/ThirdParty
            C:/Users/runneradmin/TBuild/cache_keys
          key: ${{ runner.os }}-x64-tdesktop-libs-${{ hashFiles('**/Telegram/build/prepare/**') }}

      - name: Configure
        run: |
          cd %GITHUB_WORKSPACE%\TBuild\AyuGramDesktop\Telegram
          call configure.bat x64 qt6 -D TDESKTOP_API_TEST=ON -D CMAKE_CONFIGURATION_TYPES=Debug -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF

      - name: Build Telegram
        run: |
          cmake --build %GITHUB_WORKSPACE%\TBuild\AyuGramDesktop\out --config Debug --target Telegram

      - name: Upload Telegram.exe
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Debug-x64
          path: ${{ github.workspace }}\TBuild\AyuGramDesktop\out\Debug\Telegram.exe
