name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Windows x64 Debug
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: cmd

    steps:
      - name: Disable Windows Defender
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -ExclusionPath "C:\", "$env:GITHUB_WORKSPACE", "C:\Users\runneradmin"
        shell: powershell

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ github.workspace }}\TBuild\AyuGramDesktop

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.44

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Libraries Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:/Users/runneradmin/TBuild/Libraries/win64
            C:/Users/runneradmin/TBuild/ThirdParty
            C:/Users/runneradmin/TBuild/cache_keys
          key: ${{ runner.os }}-x64-tdesktop-libs-${{ hashFiles('**/Telegram/build/prepare/**') }}
          restore-keys: |
            ${{ runner.os }}-x64-tdesktop-libs-

      - name: Prepare Libraries
        run: |
          cd %GITHUB_WORKSPACE%\TBuild\AyuGramDesktop\Telegram
          build\prepare\win.bat skip-release silent qt6

      - name: Save Libraries Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            C:/Users/runneradmin/TBuild/Libraries/win64
            C:/Users/runneradmin/TBuild/ThirdParty
            C:/Users/runneradmin/TBuild/cache_keys
          key: ${{ runner.os }}-x64-tdesktop-libs-${{ hashFiles('**/Telegram/build/prepare/**') }}

      - name: Configure
        run: |
          cd %GITHUB_WORKSPACE%\TBuild\AyuGramDesktop\Telegram
          call configure.bat x64 qt6 -D TDESKTOP_API_TEST=ON -D CMAKE_CONFIGURATION_TYPES=Debug -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF -D CMAKE_POLICY_DEFAULT_CMP0141=NEW -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -D CMAKE_CXX_FLAGS_DEBUG="/Z7" -D CMAKE_C_FLAGS_DEBUG="/Z7"

      - name: Build Telegram
        run: |
          cmake --build %GITHUB_WORKSPACE%\TBuild\AyuGramDesktop\out --config Debug --target Telegram

      - name: Upload Telegram.exe
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Debug-x64
          path: ${{ github.workspace }}\TBuild\AyuGramDesktop\out\Debug\Telegram.exe
